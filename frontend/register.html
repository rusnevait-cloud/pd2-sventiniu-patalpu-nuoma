
<!DOCTYPE html>
<html lang="lt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registracija – Švęsk šventę</title>
    <!-- Prijungiame CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Viršutinis meniu -->
    <header class="site-header">
        <div class="container nav-wrap">
            <a class="brand" href="index.html">
                <span class="brand-mark">Š</span>
                <span class="brand-name">
                    Švęsk <span>šventę</span>
                </span>
            </a>

            <nav class="main-nav">
                <a href="index.html">Pradžia</a>
                <a href="venues.html">Erdvės</a>
                <a href="index.html#about">Apie mus</a>
                <a href="login.html">Prisijungti</a>
            </nav>
        </div>
    </header>


    <!-- Registracijos langas -->
    <main class="register-page">
        <div class="register-box">
            <div class="register-logo">
                <span class="brand-mark">Š</span>
            </div>
            <h1>Sukurkite paskyrą!</h1>
            <p class="register-description">
                Užsiregistruokite ir atraskite
                tinkamiausią vietą savo šventei.
            </p>


            <!-- Registracijos forma -->
            <form id="registerForm">
                <!-- Vardas -->
                <div class="register-field">

                    <label for="name">Vardas</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Įveskite savo vardą"
                        required
                    >
                </div>


                <!-- El. paštas -->
                <div class="register-field">

                    <label for="email">El. pašto adresas</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Įveskite el. paštą"
                        required
                    >
                </div>

                <!-- Slaptažodis -->
                <div class="register-field">
                    <label for="password">Slaptažodis</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Sukurkite slaptažodį"
                        required
                    >

                </div>
                <!-- Slaptažodžio pakartojimas -->
                <div class="register-field">
                    <label for="repeatPassword">
                        Pakartokite slaptažodį
                    </label>

                    <input
                        type="password"
                        id="repeatPassword"
                        name="repeatPassword"
                        placeholder="Pakartokite slaptažodį"
                        required
                    >

                </div>

                <!-- Registracijos mygtukas -->
                <button
                    type="submit"
                    class="btn btn-primary register-button"></button>
                    Registruotis
                </button>

            </form>

            <!-- Nuoroda į prisijungimą -->
            <p class="login-text">
                Jau turite paskyrą?
                <a href="login.html">
                    Prisijungti
                </a>
            </p>
            <a href="index.html" class="back-link">
                ← Grįžti į pagrindinį puslapį
            </a>

        </div>

    </main>


    <!-- Puslapio apačia -->
    <footer class="site-footer">
        <div class="container footer-inner">

            <p>© 2026 Švęsk šventę</p>

        </div>
    </footer>
</body>
</html>
