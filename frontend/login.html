
<!DOCTYPE html>
<html lang="lt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Prisijungimas – Švęsk šventę</title>

    <!-- Prijungiame bendrą svetainės dizainą -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Viršutinis meniu -->
    <header class="site-header">
        <div class="container nav-wrap">

            <a class="brand" href="index.html">
                <span class="brand-mark">Š</span>

                <span class="brand-name">
                    Švęsk <span>šventę</span>
                </span>
            </a>

            <nav class="main-nav">
                <a href="index.html">Pradžia</a>
                <a href="venues.html">Erdvės</a>
                <a href="index.html#about">Apie mus</a>
                <a class="nav-login active" href="login.html">
                    Prisijungti
                </a>
            </nav>

        </div>
    </header>


    <!-- Prisijungimo dalis -->
    <main class="login-page">

        <div class="login-box">

            <div class="login-logo">
                <span class="brand-mark">Š</span>
            </div>

            <h1>Sveiki sugrįžę!</h1>

            <p class="login-description">
                Prisijunkite prie savo paskyros
                ir planuokite savo šventę.
            </p>

            <!-- Prisijungimo forma -->
            <form id="loginForm">

                <div class="login-field">
                    <label for="email">El. pašto adresas</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Jūsų el. paštas"
                        required
                    >
                </div>

                <div class="login-field">
                    <label for="password">Slaptažodis</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Įveskite slaptažodį"
                        required
                    >
                </div>

                <button type="submit" class="btn btn-primary login-button">
                    Prisijungti
                </button>

            </form>

            <p class="register-text">
                Dar neturite paskyros?
                <a href="register.html">Registruotis</a>
            </p>

            <a href="index.html" class="back-link">
                ← Grįžti į pagrindinį puslapį
            </a>

        </div>

    </main>


    <!-- Puslapio apačia -->
    <footer class="site-footer">
        <div class="container footer-inner">

            <p>© 2026 Švęsk šventę</p>

        </div>
    </footer>

</body>
</html>
